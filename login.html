
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | STARLUXE</title>
<link rel="stylesheet" href="styles.css">

<style>
.auth-section {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
}
.auth-card {
    width: 100%;
    max-width: 450px;
    background: #151515;
    border: 1px solid rgba(214,173,96,.35);
    padding: 35px;
}
.auth-card h1 {
    text-align: center;
    margin: 25px 0 10px;
}
.auth-card p {
    color: #aaa;
    text-align: center;
    margin-bottom: 25px;
    font-size: 13px;
}
.auth-card label {
    display: block;
    color: #d6ad60;
    font-size: 12px;
    margin: 16px 0 7px;
}
.auth-card input {
    width: 100%;
    padding: 14px;
    background: #090909;
    color: white;
    border: 1px solid #39342a;
    outline: none;
}
.auth-card input:focus {
    border-color: #d6ad60;
}
.auth-card button {
    width: 100%;
    margin-top: 24px;
    border: none;
}
.auth-message {
    margin-top: 18px;
    font-size: 13px;
    text-align: center;
    color: #f0d397;
    overflow-wrap: anywhere;
}
.auth-footer {
    margin-top: 22px;
    text-align: center;
    color: #aaa;
    font-size: 13px;
}
.auth-footer a {
    color: #d6ad60;
}
</style>
</head>

<body>

<section class="auth-section">
<div class="auth-card">

<a href="index.html" class="logo">
STAR<span>LUXE</span>
</a>

<h1>Welcome Back</h1>
<p>Sign in to access your STARLUXE account.</p>

<form id="loginForm">

<label for="email">Email Address</label>
<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label for="password">Password</label>
<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

<button type="submit" class="btn btn-gold" id="loginButton">
SIGN IN
</button>

<div class="auth-message" id="authMessage" role="status"></div>

</form>

<div class="auth-footer">
<a href="#" id="forgotPassword">Forgot your password?</a>
</div>

<div class="auth-footer">
Don't have an account?
<a href="register.html">Create Account</a>
</div>

</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
const loginForm = document.getElementById("loginForm");
const authMessage = document.getElementById("authMessage");
const loginButton = document.getElementById("loginButton");

loginForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    loginButton.disabled = true;
    loginButton.textContent = "SIGNING IN...";
    authMessage.textContent = "";

    try {
        const { data, error } =
            await window.STARLUXE_SUPABASE.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) throw error;

        authMessage.textContent = "Login successful! Welcome to STARLUXE.";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1200);

    } catch (error) {
        authMessage.textContent = error.message;
    } finally {
        loginButton.disabled = false;
        loginButton.textContent = "SIGN IN";
    }
});

document.getElementById("forgotPassword").addEventListener("click", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    if (!email) {
        authMessage.textContent = "Enter your email address first.";
        return;
    }

    try {
        const { error } =
            await window.STARLUXE_SUPABASE.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin +
                    window.location.pathname.replace(/[^/]*$/, "login.html")
            });

        if (error) throw error;

        authMessage.textContent =
            "If an account exists for this email, a password reset link will be sent.";

    } catch (error) {
        authMessage.textContent = error.message;
    }
});
</script>

</body>
</html>
