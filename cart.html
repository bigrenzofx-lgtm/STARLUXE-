<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart | STARLUXE</title>

<link rel="stylesheet" href="styles.css">

<style>
.cart-section {
    max-width: 1100px;
    margin: auto;
    padding: 65px 20px 90px;
}

.cart-heading {
    text-align: center;
    margin-bottom: 40px;
}

.cart-heading h1 {
    color: #d6ad60;
    font-size: clamp(32px, 5vw, 48px);
}

.cart-heading p {
    color: #aaa;
    margin-top: 10px;
}

.cart-layout {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 30px;
    align-items: start;
}

.cart-items {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.cart-item {
    display: flex;
    gap: 18px;
    padding: 18px;
    background: #151515;
    border: 1px solid #292929;
    border-radius: 9px;
}

.cart-item img {
    width: 125px;
    height: 125px;
    object-fit: cover;
    border-radius: 6px;
    background: #252525;
}

.item-details {
    flex: 1;
}

.item-details h3 {
    color: white;
    margin-bottom: 8px;
}

.item-details p {
    color: #999;
    font-size: 14px;
    line-height: 1.5;
}

.item-price {
    color: #d6ad60;
    font-size: 19px;
    font-weight: bold;
    margin-top: 12px;
}

.remove-btn {
    background: transparent;
    border: none;
    color: #e47c7c;
    cursor: pointer;
    margin-top: 12px;
    font-size: 13px;
}

.cart-summary {
    padding: 25px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 9px;
}

.cart-summary h2 {
    color: #d6ad60;
    margin-bottom: 25px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: #aaa;
    margin-bottom: 18px;
}

.summary-row strong {
    color: white;
}

.summary-total {
    border-top: 1px solid #444;
    padding-top: 20px;
    margin-top: 20px;
}

.summary-total strong {
    color: #d6ad60;
    font-size: 23px;
}

.checkout-btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: #d6ad60;
    color: #111;
    text-align: center;
    text-decoration: none;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    margin-top: 25px;
    cursor: pointer;
}

.continue-shopping {
    display: block;
    text-align: center;
    color: #d6ad60;
    margin-top: 18px;
    text-decoration: none;
}

.empty-cart {
    text-align: center;
    padding: 65px 20px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 9px;
}

.empty-cart h2 {
    color: #d6ad60;
    margin-bottom: 12px;
}

.empty-cart p {
    color: #aaa;
    margin-bottom: 25px;
}

.empty-cart a {
    display: inline-block;
    padding: 13px 25px;
    background: #d6ad60;
    color: #111;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

@media(max-width: 750px) {
    .cart-layout {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 480px) {
    .cart-item {
        flex-direction: column;
    }

    .cart-item img {
        width: 100%;
        height: 190px;
    }
}
</style>
</head>

<body>

<header class="site-header">
    <div class="container header-inner">

        <a href="index.html" class="logo">
            STAR<span>LUXE</span>
        </a>

        <button class="menu-toggle" aria-label="Open navigation">
            ☰
        </button>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="celebrities.html">Celebrities</a>
            <a href="experiences.html">Experiences</a>
            <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
        </nav>

    </div>
</header>


<main class="cart-section">

    <div class="cart-heading">
        <h1>Your Shopping Cart</h1>
        <p>Review your selected celebrity experiences and products.</p>
    </div>

    <div id="cart-content"></div>

</main>


<footer class="site-footer">
    <div class="container">

        <div class="footer-content">

            <div>
                <a href="index.html" class="logo">
                    STAR<span>LUXE</span>
                </a>
                <p>Where Celebrity Meets Luxury.</p>
            </div>

            <div>
                <h4>Explore</h4>
                <a href="celebrities.html">Celebrities</a>
                <a href="experiences.html">Experiences</a>
            </div>

            <div>
                <h4>Shopping</h4>
                <a href="cart.html">Shopping Cart</a>
                <a href="checkout.html">Checkout</a>
            </div>

        </div>

        <p class="copyright">
            © <span id="current-year"></span> STARLUXE.
            All rights reserved.
        </p>

    </div>
</footer>


<script src="data.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function() {

    const cart = window.STARLUXE_CART;
    const content = document.getElementById("cart-content");

    document.getElementById("current-year").textContent =
        new Date().getFullYear();


    function escapeHTML(value) {

        return String(value ?? "").replace(/[&<>"']/g, function(char) {

            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return entities[char];

        });

    }


    function getItems() {

        if (!cart) return [];

        return cart.getItems();

    }


    function getPrice(item) {

        return Number(item.price ?? item.selling_price ?? 0);

    }


    function getCurrency(item) {

        return item.currency || "USD";

    }


    function formatPrice(amount, currency) {

        return new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: currency || "USD"
        }).format(Number(amount) || 0);

    }


    function getImage(item) {

        return item.image ||
            (Array.isArray(item.image_urls) ? item.image_urls[0] : "") ||
            "https://placehold.co/300x300/171717/d6ad60?text=STARLUXE";

    }


    function updateCounter() {

        document.getElementById("cart-count").textContent =
            cart ? cart.getCount() : 0;

    }


    function renderCart() {

        if (!cart) {

            content.innerHTML = `
                <div class="empty-cart">
                    <h2>Shopping Cart Unavailable</h2>
                    <p>Please refresh the page and try again.</p>
                    <a href="experiences.html">Explore Experiences</a>
                </div>
            `;

            return;

        }

        const items = getItems();

        updateCounter();


        if (!items.length) {

            content.innerHTML = `
                <div class="empty-cart">
                    <h2>Your Cart Is Empty</h2>

                    <p>
                        You haven't selected any celebrity experiences
                        or products yet.
                    </p>

                    <a href="experiences.html">
                        Explore Experiences
                    </a>
                </div>
            `;

            return;

        }


        const currencies = [...new Set(items.map(getCurrency))];

        if (currencies.length > 1) {

            content.innerHTML = `
                <div class="empty-cart">
                    <h2>Separate Currencies Detected</h2>
                    <p>
                        Your cart currently contains items in different
                        currencies. Please remove items until only one
                        currency remains before checkout.
                    </p>
                    <a href="experiences.html">Continue Shopping</a>
                </div>
            `;

            return;

        }


        const currency = currencies[0] || "USD";

        const subtotal = items.reduce(function(total, item) {

            return total + getPrice(item);

        }, 0);


        const itemHTML = items.map(function(item, index) {

            const title = item.title ||
                item.name ||
                "STARLUXE Experience";

            const description = item.description ||
                "Exclusive celebrity experience.";

            const id = item.id ?? "";

            return `

                <article class="cart-item">

                    <img
                        src="${escapeHTML(getImage(item))}"
                        alt="${escapeHTML(title)}"
                        onerror="this.src='https://placehold.co/300x300/171717/d6ad60?text=STARLUXE'"
                    >

                    <div class="item-details">

                        <h3>${escapeHTML(title)}</h3>

                        <p>${escapeHTML(description)}</p>

                        <div class="item-price">
                            ${formatPrice(getPrice(item), currency)}
                        </div>

                        <button
                            class="remove-btn"
                            onclick="removeCartItem('${escapeHTML(id)}', ${index})"
                        >
                            Remove Item
                        </button>

                    </div>

                </article>

            `;

        }).join("");


        content.innerHTML = `

            <div class="cart-layout">

                <div class="cart-items">
                    ${itemHTML}
                </div>

                <aside class="cart-summary">

                    <h2>Order Summary</h2>

                    <div class="summary-row">
                        <span>Items</span>
                        <strong>${items.length}</strong>
                    </div>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong>${formatPrice(subtotal, currency)}</strong>
                    </div>

                    <div class="summary-row">
                        <span>Shipping / Service Fees</span>
                        <strong>Calculated at checkout</strong>
                    </div>

                    <div class="summary-row summary-total">
                        <span>Subtotal</span>
                        <strong>${formatPrice(subtotal, currency)}</strong>
                    </div>

                    <a href="checkout.html" class="checkout-btn">
                        Proceed to Checkout
                    </a>

                    <a href="experiences.html" class="continue-shopping">
                        Continue Shopping
                    </a>

                </aside>

            </div>

        `;

    }


    window.removeCartItem = function(id, index) {

        if (!cart) return;

        const items = getItems();

        const item = items[index];

        if (!item || String(item.id ?? "") !== String(id)) {
            return;
        }

        cart.removeItem(item.id);

        renderCart();

    };


    // Mobile navigation
    const menuButton = document.querySelector(".menu-toggle");
    const navigation = document.querySelector(".main-nav");

    if (menuButton && navigation) {

        menuButton.addEventListener("click", function() {

            navigation.classList.toggle("active");

        });

    }


    renderCart();

});

</script>

</body>
</html>
